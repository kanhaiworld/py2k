[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pynba2k"
version = "0.1.0"
description = "Unofficial Python client for the NBA 2K API (nba2kapi.com)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Kanhai Wadekar" }]
keywords = ["nba", "nba2k", "api", "client", "basketball"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "requests>=2.31",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dataframe = ["pandas>=2.0"]
dev = [
    "pytest>=8.0",
    "responses>=0.25",
    "pandas>=2.0",
]

[project.urls]
Homepage = "https://github.com/kanhaiworld/py2k"

[tool.hatch.build.targets.wheel]
packages = ["py2k"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
