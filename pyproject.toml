[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "py2k"
version = "0.1.0"
description = "Unofficial Python client for the NBA 2K API (nba2kapi.com)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [{ name = "Kanhai Wadekar" }]
dependencies = [
    "requests>=2.31",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dataframe = ["pandas>=2.0"]
dev = [
    "pytest>=8.0",
    "responses>=0.25",
    "pandas>=2.0",
]

[project.urls]
Homepage = "https://github.com/kanhaiworld/py2k"

[tool.hatch.build.targets.wheel]
packages = ["py2k"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
